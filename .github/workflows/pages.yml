name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 캐시 무효화: index.html의 ?v=__V__ 를 커밋 해시로 치환
      - run: |
          mkdir _site
          cp index.html app.js style.css config.js _site/
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
